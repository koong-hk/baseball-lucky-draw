<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚾ BASEBALL LUCKY DRAW</title><style>
*{box-sizing:border-box}body{margin:0;background:#061b17;color:#fff7e8;font-family:system-ui,sans-serif}.wrap{max-width:950px;margin:auto;padding:14px}header{text-align:center;padding:22px 8px;background:linear-gradient(120deg,#0b3329,#092019);border-bottom:2px solid #d8a44e;border-radius:16px}.gold{color:#f3cb76;letter-spacing:3px;font-size:12px}h1{font-size:clamp(22px,5vw,36px);margin:8px}.stats{display:flex;justify-content:space-between;margin:16px 0 10px;font-weight:bold}.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;background:#0a3026;padding:10px;border-radius:15px;border:1px solid #32634e}.ball{min-width:0;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 20%,white,#d8e3dd);border:1px solid #b5c9bd;font-size:clamp(13px,3vw,26px);cursor:pointer;padding:0}.ball.sel{outline:3px solid #ffc35b;background:#fff0a5}.ball.used{background:#234538;color:#77988b;font-size:12px;cursor:default}.actions{display:flex;justify-content:center;gap:10px;margin:14px 0}.btn{background:linear-gradient(#ffda80,#d99536);color:#241b10;border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.4}.secondary{background:#295144;color:white}.selected{text-align:center;color:#f3cb76;margin-top:14px;font-weight:bold}.stadium{height:clamp(230px,40vw,340px);position:relative;overflow:hidden;border-radius:16px;border:2px solid #d5ac5b;background:linear-gradient(180deg,#b9e8ff 0%,#79c3eb 40%,#d8f1ff 60%,#3a8b73 100%)}.lights{position:absolute;top:8px;left:0;right:0;text-align:center;color:white;font-size:25px;letter-spacing:20px;text-shadow:0 0 14px #fff}.stands{position:absolute;top:70px;width:100%;height:110px;background:repeating-linear-gradient(0deg,#37697a 0 6px,#6094a1 7px 10px)}.grass{position:absolute;bottom:-70px;left:-10%;width:120%;height:200px;border-radius:50% 50% 0 0;background:repeating-linear-gradient(90deg,#2b9a58 0 65px,#43ac69 65px 130px);border-top:4px solid #a6c796}.diamond{position:absolute;bottom:-100px;left:50%;width:170px;height:170px;transform:translateX(-50%) rotate(45deg);background:#ad7d55;border:3px solid #fff}.batter{position:absolute;bottom:13%;left:18%;width:90px;height:150px;z-index:3;filter:drop-shadow(0 7px 5px #0009)}.bat{position:absolute;bottom:39%;left:29%;width:125px;height:13px;border-radius:80% 10px 10px 80%;background:linear-gradient(#f9dfab,#b77839,#6c3c22);transform:rotate(52deg);transform-origin:8% 50%;z-index:4}.batter{width:clamp(110px,20vw,165px);height:clamp(170px,28vw,225px);bottom:7%;left:17%}.bat-svg{transform-box:fill-box;transform-origin:24% 65%;transform:rotate(0deg)}.bat-svg.swing{animation:swing .85s cubic-bezier(.2,.55,.2,1) forwards}#torso{transform-origin:75px 115px}.batter:has(.swing) #torso{animation:bodyturn .85s ease-in-out forwards}.fly{position:absolute;left:55%;bottom:43%;font-size:38px;opacity:0;z-index:5}.fly.go{animation:fly 1.35s ease-out forwards}.spark{position:absolute;left:53%;bottom:43%;font-size:50px;opacity:0;z-index:6}.spark.go{animation:spark .6s}.banner{position:absolute;top:14px;left:0;width:100%;text-align:center;font-size:clamp(22px,5vw,42px);font-weight:1000;color:#ffe49e;text-shadow:0 2px 12px #000;z-index:7}.stadium.shake{animation:shake .35s}.result{background:#fff8e8;color:#214432;border:2px solid #d5a854;padding:20px;text-align:center;border-radius:14px;margin:14px 0;animation:reveal .6s}.prizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.prize{background:#143b2e;border:1px solid #39634c;border-radius:9px;padding:10px;font-size:12px}.prize small{display:block;color:#c7d9c9;margin-top:5px}.confirm{display:none;text-align:center;padding:14px;background:#174033;border-radius:12px;margin-bottom:12px}@keyframes swing{0%{transform:rotate(0deg)}25%{transform:rotate(12deg)}55%{transform:rotate(-40deg)}75%{transform:rotate(-88deg)}100%{transform:rotate(-110deg)}}@keyframes bodyturn{0%,25%{transform:rotate(0)}60%{transform:rotate(-8deg)}100%{transform:rotate(-13deg)}}@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(350px,-250px) scale(.1) rotate(700deg)}}@keyframes spark{20%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(2.5)}}@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(5px,-2px)}}@keyframes reveal{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.pitcher{position:absolute;bottom:25%;left:58%;width:clamp(80px,13vw,118px);height:clamp(125px,21vw,176px);z-index:3;filter:drop-shadow(0 5px 3px #1235)}.pitcher-body{transform-origin:60px 115px}.pitcher.throw .pitcher-body{animation:pitchmotion .95s ease-in-out forwards}.pitch-arm{transform-origin:80px 65px}.pitcher.throw .pitch-arm{animation:pitcharm .95s ease-in-out forwards}.batter{left:14%;bottom:5%;z-index:4}.bat-svg{transform-origin:110px 64px;transform-box:view-box}.bat-svg.swing{animation:rightswing .75s cubic-bezier(.18,.62,.25,1) forwards}.batter:has(.swing) .hitter-upper{animation:hitterturn .75s ease-in-out forwards;transform-origin:74px 115px}.pitch-ball{position:absolute;left:64%;bottom:49%;font-size:23px;opacity:0;z-index:6;pointer-events:none}.pitch-ball.go{animation:pitchflight .65s linear forwards}.fly{left:30%;bottom:47%}.fly.go{animation:hitflight 1.35s ease-out forwards}.spark{left:31%;bottom:48%}@keyframes pitchmotion{0%,25%{transform:rotate(0)}45%{transform:rotate(-12deg)}70%{transform:rotate(12deg)}100%{transform:rotate(3deg)}}@keyframes pitcharm{0%,30%{transform:rotate(0)}60%{transform:rotate(-65deg)}100%{transform:rotate(-115deg)}}@keyframes pitchflight{0%{opacity:1;transform:translate(0,-12px) scale(.7)}95%{opacity:1}100%{opacity:0;transform:translate(-260px,24px) scale(1.4)}}@keyframes rightswing{0%{transform:rotate(0deg)}25%{transform:rotate(18deg)}50%{transform:rotate(-22deg)}70%{transform:rotate(-80deg)}100%{transform:rotate(-130deg)}}@keyframes hitterturn{0%,25%{transform:rotate(0)}65%{transform:rotate(-9deg)}100%{transform:rotate(-15deg)}}@keyframes hitflight{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(360px,-225px) scale(.15) rotate(650deg)}}.photo-scene{position:absolute;inset:0;background-image:url('stadium-reference.jpg');background-position:center;background-size:cover;z-index:2}.pitch-ball{left:73%;bottom:64%}.pitch-ball.go{animation:photoPitch .75s linear forwards}.fly{left:30%;bottom:61%}.fly.go{animation:photoFly 1.35s ease-out forwards}.spark{left:31%;bottom:61%}@keyframes photoPitch{from{opacity:1;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(-220px,48px) scale(1.2)}}@keyframes photoFly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(350px,-190px) scale(.15)}}</style><div class="wrap"><header><div class="gold">✦ CHAMPIONSHIP EDITION ✦</div><h1>⚾ BASEBALL LUCKY DRAW</h1>운명의 한 타석 · 100개의 야구공</header><div class="stats"><span id="remain"></span><span id="count"></span></div><div class="board" id="board"></div><div class="selected" id="selected">야구공 하나를 선택하세요</div><div class="actions"><button id="hit" class="btn" disabled>⚾ SWING!</button><button id="reset" class="btn secondary">↻ 새 게임</button></div><div class="confirm" id="confirm">새 게임을 시작할까요?<p>기존 기록이 초기화되고 100개의 당첨 위치가 다시 섞입니다.</p><button id="yes" class="btn">초기화하기</button> <button id="no" class="btn secondary">취소</button></div><div class="stadium" id="stadium"><div class="lights">✦ ✦ ✦ ✦ ✦</div><div class="stands"></div><div class="grass"></div><div class="diamond"></div><div class="photo-scene" role="img" aria-label="첨부한 야구장 사진"><div class="pitch-ball" id="pitchBall">⚾</div><div class="fly" id="fly">⚾</div><div class="spark" id="spark">✴️</div></div><div class="banner" id="banner">PLAY BALL!</div></div><div id="result"></div><h3>🏆 야구 기록 · 당첨 상품</h3><div class="prizes" id="prizes"></div><p style="text-align:center;color:#9ab6a7;font-size:11px">당첨 위치는 새 게임 시작 시 고정됩니다. 타격한 공은 다시 선택할 수 없습니다.</p></div><script>
(()=>{const $=id=>document.getElementById(id),items=[['퍼펙트게임','자유시간 1시간 이용권',2],['노히트노런','아빠랑 장기 3판',3],['사이클링히트','마인크래프트 30분 시청권',5],['만루홈런','로보77 30분 이용권',7],['완봉, 완투승','그림 그리기 1시간',10],['더블플레이','한 번 더 뽑기',15],['2루타','1000원',15],['도루','500원',18],['삼진아웃','꽝',24],['병살타','역사 공부 30분',1]];const key='baseball-lucky-draw-premium-v1';let selected=null,busy=false,epoch=0;function fresh(){const board=[];items.forEach((p,i)=>{for(let j=0;j<p[2];j++)board.push(i)});for(let i=board.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[board[i],board[j]]=[board[j],board[i]]}return{board,used:[]}}let game;try{game=JSON.parse(localStorage.getItem(key));if(!game||!Array.isArray(game.board)||game.board.length!==100||!Array.isArray(game.used))game=fresh()}catch{game=fresh()}function save(){try{localStorage.setItem(key,JSON.stringify(game))}catch{}}function render(){const grid=$('board');grid.replaceChildren();for(let i=0;i<100;i++){const used=game.used.includes(i),b=document.createElement('button');b.className='ball'+(used?' used':'')+(selected===i?' sel':'');b.textContent=used?'✓':'⚾';b.disabled=used||busy;b.title=(i+1)+'번 공';b.onclick=()=>{selected=i;$('selected').textContent=(i+1)+'번 야구공 선택!';render()};grid.appendChild(b)}$('remain').textContent='남은 공 '+(100-game.used.length);$('count').textContent='타격 '+game.used.length+'회';$('hit').disabled=selected===null||busy}function clear(){['bat','fly','spark','pitchBall'].forEach(id=>$(id).classList.remove('swing','go'));$('stadium').classList.remove('shake')}const wait=ms=>new Promise(r=>setTimeout(r,ms));$('prizes').innerHTML=items.map((p,i)=>'<div class="prize"><b>'+(i+1)+'등 · '+p[0]+'</b><small>'+p[1]+' · '+p[2]+'%</small></div>').join('');$('hit').onclick=async()=>{if(selected===null||busy)return;const pos=selected,rank=game.board[pos],token=epoch;selected=null;busy=true;game.used.push(pos);save();render();$('result').innerHTML='';clear();$('banner').textContent='READY...';await wait(300);if(token!==epoch)return;$('banner').textContent='PITCH!';await wait(350);if(token!==epoch)return;$('pitchBall').classList.add('go');await wait(490);if(token!==epoch)return;await wait(300);if(token!==epoch)return;$('fly').classList.add('go');$('spark').classList.add('go');$('stadium').classList.add('shake');$('banner').textContent='CRACK!';await wait(1400);if(token!==epoch)return;const p=items[rank];$('banner').textContent=rank===0?'LEGENDARY!':rank===8?'STRIKE OUT!':'NICE PLAY!';$('result').innerHTML='<div class="result"><div>'+(rank+1)+'등 · BASEBALL RESULT</div><h1>'+p[0]+'</h1><b>🎁 '+p[1]+'</b>'+(rank===5?'<p>보너스! 다른 야구공을 선택하세요.</p>':'')+'</div>';busy=false;render()};$('reset').onclick=()=>{$('confirm').style.display='block'};$('no').onclick=()=>{$('confirm').style.display='none'};$('yes').onclick=()=>{epoch++;game=fresh();selected=null;busy=false;save();$('confirm').style.display='none';$('result').innerHTML='';$('selected').textContent='야구공 하나를 선택하세요';clear();$('banner').textContent='PLAY BALL!';render()};render()})();
</script>
